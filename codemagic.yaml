workflows:
  weather-app-build:
    name: Weather App Build
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
          source: true

    scripts:
      - name: Get dependencies
        script: flutter pub get

      - name: Build Android APK
        script: flutter build apk --release

      - name: Build iOS App
        script: flutter build ios --release --no-codesign

      - name: Create unsigned_app.ipa
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../unsigned_app.ipa Payload/
          cd ../..
          echo "✅ unsigned_app.ipa created"

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - unsigned_app.ipa

    publishing:
      email:
        recipients:
          - arieltungol20@gmail.com
        notify:
          success: true
          failure: true