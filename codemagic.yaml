workflows:
  ios-ipa-only:
    name: iOS IPA for Sideloadly
    max_build_duration: 15
    instance_type: mac_mini_m1

    environment:
      flutter: stable
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true

    scripts:
      - name: Get dependencies
        script: flutter pub get

      - name: Build iOS App
        script: flutter build ios --release --no-codesign

      - name: Create unsigned_app.ipa
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../unsigned_app.ipa Payload/
          cd ../..
          echo "✅ unsigned_app.ipa created!"

    artifacts:
      - unsigned_app.ipa

    publishing:
      email:
        recipients:
          - arieltungol20@gmail.com