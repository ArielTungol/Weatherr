workflows:
  weather-app-build:
    name: Weather App Build
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
          source: true
      cancel_previous_builds: true

    scripts:
      - name: Clean and Get Dependencies
        script: |
          echo "🧹 Cleaning project..."
          flutter clean
          echo "📦 Getting dependencies..."
          flutter pub get
          echo "✅ Dependencies installed"

      - name: Build Android APK
        script: |
          echo "🤖 Building Android APK..."
          flutter build apk --release
          echo "✅ Android APK built successfully"

      - name: Build iOS App
        script: |
          echo "🍎 Building iOS app (no code signing)..."
          flutter build ios --release --no-codesign
          
          # Check if build succeeded
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            echo "✅ iOS build successful!"
          else
            echo "❌ Error: iOS build failed"
            ls -la build/ios/iphoneos/ || true
            exit 1
          fi

      - name: Create unsigned_app.ipa for Sideloadly
        script: |
          echo "📦 Creating IPA file for Sideloadly..."
          
          # Navigate to iOS build folder
          cd build/ios/iphoneos
          
          # Create Payload folder and copy app
          mkdir -p Payload
          cp -r Runner.app Payload/
          
          # Create the IPA file
          zip -r ../../unsigned_app.ipa Payload/
          
          # Go back to root
          cd ../..
          
          # Verify IPA was created
          if [ -f "unsigned_app.ipa" ]; then
            echo "✅ unsigned_app.ipa created successfully!"
            echo "📊 File size: $(du -sh unsigned_app.ipa | cut -f1)"
          else
            echo "❌ Failed to create IPA"
            exit 1
          fi

      - name: List All Generated Files
        script: |
          echo ""
          echo "==================================="
          echo "    📦 BUILD COMPLETE 📦"
          echo "==================================="
          echo ""
          
          echo "📱 iOS IPA for Sideloadly:"
          if [ -f "unsigned_app.ipa" ]; then
            echo "   ✅ unsigned_app.ipa - $(du -sh unsigned_app.ipa | cut -f1)"
          else
            echo "   ❌ IPA not found"
          fi
          echo ""
          
          echo "🤖 Android APK:"
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            echo "   ✅ app-release.apk - $(du -sh build/app/outputs/flutter-apk/app-release.apk | cut -f1)"
          else
            echo "   ❌ APK not found"
          fi
          echo ""
          
          echo "==================================="
          echo "✅ Build completed successfully!"
          echo "==================================="

    artifacts:
      # iOS IPA for Sideloadly
      - unsigned_app.ipa

      # Android APK
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
      - build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

    publishing:
      email:
        recipients:
          - arieltungol20@gmail.com
        notify:
          success: true
          failure: true